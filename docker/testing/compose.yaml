# The machines of the container suite. See README.md in this directory.
#
# relay is reachable from the others as relay.example.com, so the deployment
# guide's commands run as written. Nothing is published to the host: the
# driver reaches each machine only with docker compose exec and cp, the
# container form of ssh and scp.
#
# relay-b and relay-c exist for family F, which is about mail crossing from one
# relay to another. Three are needed and not two: an undeliverable that unwinds
# needs a hop in the middle, since with two relays the sender's own relay is the
# one that meets the refusal and nothing has to travel. They are named rather
# than numbered because that family is about relay names being local — each
# operator calls a neighbour whatever they chose, and the courier homes in the
# fixture deliberately use different names in each direction — so a numbered
# relay2 would invite the reading that the numbers mean something everywhere.
#
# dave lives on relay-c and is who mail crosses to. bob holding two relays in
# one home would be a smaller change and the wrong one: that is
# PLAN-MULTIRELAY's subject, one identity on several relays, where this is two
# operators peering.
name: auu-e2e

services:
  relay:
    build:
      context: ../..
      dockerfile: docker/testing/Dockerfile
      # The previous release, cloned at its tag by run.sh for family O. A
      # compose command run by hand, which builds nothing, never reads it;
      # a build without run.sh fails at the stage that wants it, saying so.
      additional_contexts:
        prev: ${AUU_E2E_PREV:-./prev-is-cloned-by-run.sh}
    image: auu-e2e
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-relay.sh"]
    restart: "no"
    # Only so one matrix row can put the message directory on a tmpfs of a
    # megabyte and watch the disk fill: the relay process itself runs as
    # auu with no capability at all, as the unit runs it.
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor=unconfined"]
    networks:
      default:
        aliases: [relay.example.com]
    volumes:
      - relay-state:/var/lib/auu
      - relay-etc:/etc/auu
      - snap:/snap

  relay-b:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-relay.sh"]
    restart: "no"
    networks:
      default:
        aliases: [relay-b.example.com]
    volumes:
      - relay-b-state:/var/lib/auu
      - relay-b-etc:/etc/auu
      - snap:/snap

  relay-c:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-relay.sh"]
    restart: "no"
    networks:
      default:
        aliases: [relay-c.example.com]
    volumes:
      - relay-c-state:/var/lib/auu
      - relay-c-etc:/etc/auu
      - snap:/snap

  operator:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-user.sh"]
    volumes:
      - operator-home:/home/you
      - snap:/snap

  alice:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-user.sh"]
    volumes:
      - alice-home:/home/alice
      - snap:/snap

  bob:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-user.sh"]
    volumes:
      - bob-home:/home/bob
      - snap:/snap

  dave:
    image: auu-e2e
    pull_policy: never
    init: true
    entrypoint: ["/usr/local/bin/entrypoint-user.sh"]
    volumes:
      - dave-home:/home/dave
      - snap:/snap

volumes:
  relay-state:
  relay-etc:
  relay-b-state:
  relay-b-etc:
  relay-c-state:
  relay-c-etc:
  operator-home:
  alice-home:
  bob-home:
  dave-home:
  snap:
